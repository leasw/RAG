<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org-AI-Body 채팅</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e2e4e9;
    --text: #1f2a44;
    --muted: #6b7280;
    --user-bg: #2e5eaa;
    --user-fg: #ffffff;
    --bot-bg: #eef1f6;
    --bot-fg: #1f2a44;
    --accent: #2e5eaa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --panel: #1c1f28;
      --border: #2a2e3a;
      --text: #e7e9ee;
      --muted: #9aa1b1;
      --bot-bg: #262a36;
      --bot-fg: #e7e9ee;
      --accent: #6b9bf0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .stats { font-size: 12px; color: var(--muted); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; max-width: 78%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user-bg); color: var(--user-fg); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.bot .bubble { background: var(--bot-bg); color: var(--bot-fg); border-bottom-left-radius: 4px; }
  .msg.bot .bubble.error { background: #fae1e1; color: #a62c2c; }
  /* 봇 말풍선 안 마크다운 렌더링 스타일 */
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 12px 0 6px; line-height: 1.3; }
  .bubble h1:first-child, .bubble h2:first-child, .bubble h3:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 22px; }
  .bubble li { margin: 2px 0; }
  .bubble a { color: inherit; text-decoration: underline; }
  .bubble strong { font-weight: 700; }
  .bubble code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.92em;
    background: rgba(127,127,127,0.18);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .bubble pre {
    background: rgba(127,127,127,0.18);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0 0 8px;
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble blockquote {
    margin: 0 0 8px;
    padding-left: 10px;
    border-left: 3px solid var(--border);
    color: var(--muted);
  }
  .bubble table {
    border-collapse: collapse;
    margin: 0 0 8px;
    font-size: 0.93em;
    max-width: 100%;
    display: block;
    overflow-x: auto;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--border);
    padding: 5px 9px;
    text-align: left;
  }
  .bubble th { background: rgba(127,127,127,0.15); font-weight: 700; }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; padding: 0 4px; }
  .meta .tag {
    display: inline-block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 6px;
    margin-right: 4px;
  }
  #composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
  }
  #composer form {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    max-height: 140px;
  }
  #send {
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-size: 13px; padding: 0 4px; }
  .typing::after { content: "…"; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0%,20%{content:"."} 40%{content:".."} 60%,100%{content:"..."} }
</style>
</head>
<body>
<header>
  <h1>Org-AI-Body</h1>
  <div class="stats" id="stats">메모리 상태 불러오는 중…</div>
</header>
<div id="log"></div>
<div id="composer">
  <form id="form">
    <textarea id="input" rows="1" placeholder="질문을 입력하세요… (Shift+Enter로 줄바꿈)"></textarea>
    <button id="send" type="submit">보내기</button>
  </form>
</div>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statsEl = document.getElementById('stats');

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 아주 작은 마크다운 -> HTML 변환기. 외부 라이브러리 없이(로컬 툴이라 오프라인
// 동작이 우선) 모델이 실제로 잘 쓰는 문법만 지원한다: 코드블록/인라인코드, 헤더,
// 굵게/기울임, 링크, 순서/비순서 목록, 인용, 문단. HTML은 먼저 이스케이프하고
// 그 위에 마크다운 태그를 씌운다 — 모델 출력에 <script> 같은 게 섞여도 그대로
// 텍스트로만 보이게 하기 위해서다.
function renderMarkdown(text) {
  let html = escapeHtml(text);
  // 표 셀 안에서는 실제 줄바꿈을 못 쓰니 모델이 <br>로 줄을 바꾸는 게 흔한
  // 관행이다. escapeHtml이 그것도 문자 그대로 이스케이프해버리므로, <br>만
  // 화이트리스트로 다시 살린다(그 외 태그는 계속 텍스트로만 보임).
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');

  const blocks = [];
  html = html.replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (_m, _lang, code) => {
    blocks.push(`<pre><code>${code.replace(/\n$/, '')}</code></pre>`);
    return `\n\n@@BLOCK${blocks.length - 1}@@\n\n`;
  });

  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  html = html.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g, '$1<em>$2</em>');
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  html = html.replace(/(^|\n)((?:[-*] .+(?:\n|$))+)/g, (_m, pre, block) => {
    const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^[-*]\s+/, '') + '</li>').join('');
    return pre + '<ul>' + items + '</ul>';
  });
  html = html.replace(/(^|\n)((?:\d+\. .+(?:\n|$))+)/g, (_m, pre, block) => {
    const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\.\s+/, '') + '</li>').join('');
    return pre + '<ol>' + items + '</ol>';
  });

  // 마크다운 표: 헤더행 다음에 |---|---| 형태의 구분행이 오는 GFM 표만 인식한다.
  html = html.replace(/(^|\n)((?:\|.*\|[ \t]*\n?){2,})/g, (m, pre, block) => {
    const rows = block.trim().split('\n').map(r => r.trim());
    if (rows.length < 2 || !/^\|?[\s:|-]+\|?$/.test(rows[1])) return m;
    const cells = row => row.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
    const head = cells(rows[0]).map(c => `<th>${c}</th>`).join('');
    const body = rows.slice(2).map(r => `<tr>${cells(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    return `${pre}<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  });

  html = html.split(/\n{2,}/).map(part => {
    const trimmed = part.trim();
    if (!trimmed) return '';
    if (/^<(h[1-3]|ul|ol|blockquote|pre|table)/.test(trimmed) || /^@@BLOCK\d+@@$/.test(trimmed)) return trimmed;
    return '<p>' + trimmed.replace(/\n/g, '<br>') + '</p>';
  }).filter(Boolean).join('');

  html = html.replace(/@@BLOCK(\d+)@@/g, (_m, i) => blocks[Number(i)]);
  return html;
}

function addMessage(role, text, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (meta && meta.error ? ' error' : '');
  if (role === 'bot' && !(meta && meta.error)) {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }
  wrap.appendChild(bubble);
  if (meta && meta.tags && meta.tags.length) {
    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.innerHTML = meta.tags.map(t => `<span class="tag">${t}</span>`).join('');
    wrap.appendChild(metaEl);
  }
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing';
  const t = document.createElement('div');
  t.className = 'typing';
  t.textContent = '생각하는 중';
  wrap.appendChild(t);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function refreshStats() {
  try {
    const res = await fetch('/api/stats');
    const data = await res.json();
    if (data.ok) {
      const s = data.stats;
      statsEl.textContent = `STM ${s.stm.facts} · MTM ${s.mtm.facts} · LTM ${s.ltm.facts}`;
    }
  } catch (e) {
    statsEl.textContent = '메모리 상태를 불러올 수 없습니다';
  }
}

async function sendMessage(text) {
  addMessage('user', text);
  addTyping();
  sendBtn.disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    removeTyping();
    if (!data.ok) {
      addMessage('bot', data.error || '오류가 발생했습니다', { error: true });
      return;
    }
    const tags = [];
    if (data.tool_calls && data.tool_calls.length) {
      data.tool_calls.forEach(tc => tags.push(`${tc.tool}(${tc.tier}) ${tc.result_count}건`));
    }
    if (data.stm_facts_added) tags.push(`STM +${data.stm_facts_added}`);
    if (data.promoted && (data.promoted.add || data.promoted.update)) {
      tags.push(`승격 add${data.promoted.add||0}/upd${data.promoted.update||0}`);
    }
    addMessage('bot', data.answer || '(빈 응답)', { tags });
    refreshStats();
  } catch (e) {
    removeTyping();
    addMessage('bot', '네트워크 오류: ' + e.message, { error: true });
  } finally {
    sendBtn.disabled = false;
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  sendMessage(text);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

refreshStats();
addMessage('bot', '안녕하세요. 조직지식 에이전트입니다. 무엇이 궁금하신가요?');
</script>
</body>
</html>
