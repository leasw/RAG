# 문서 벡터 RAG 설정
#
# 파이프라인은 D:/RAG 벤치마크에서 nDCG@10 1위였던 조합을 그대로 가져옵니다.
#   Dense(google/gemini-embedding-2) + BM25+ -> RRF -> local BAAI/bge-reranker-v2-m3
# 벤치마크 결과: nDCG@10 avg 0.8581 (EN-1 0.7756 / KO-1 0.9615 / KO-2 0.8373)

corpus:
  # 인제스천 대상 루트. 상대 경로는 프로젝트 루트 기준.
  #
  # 이 RAG가 에이전트의 장기기억(LTM) 역할을 맡는다. 메모리 계층은 STM/MTM 2단계만
  # 남고, "공식 계획서 / 조직 기준 / 확정된 산출물"은 전부 여기서 검색한다.
  roots:
    - "../20200504_지식서비스산업핵심기술개발사업"
  # 인제스천에서 제외할 디렉터리 이름
  exclude_dirs: [".git", "__pycache__", ".venv"]
  # 개별 파일 최대 크기(MB). 넘으면 건너뜁니다.
  max_file_mb: 120

openrouter:
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
  request_timeout_s: 120
  max_retries: 5
  batch_size: 32

embedding:
  # 300M급으로 축소(기존 arctic-ko 568M -> mE5-base 278M). 인계 문서(D:\Agent_RAG
  # 세션)가 저사양 GPU 대응으로 이미 벤치마크한 조합을 그대로 채택했다 — mE5-base +
  # bge-reranker-base 페어, "목적 탐지 4수단" 벤치마크에서 실측 완료된 조합이다.
  # 정확도(nDCG)는 이전 568M 조합보다 낮을 걸로 예상되나 별도 재측정은 안 했다 —
  # 그래프RAG/문서RAG의 실제 청크로 다시 재보든지, 품질 저하가 체감되면 원복할 것.
  backend: local            # local | openrouter
  id: intfloat/multilingual-e5-base
  dimensions: 768
  device: cuda              # cuda 불가 시 cpu 자동 폴백
  batch_size: 32
  max_seq_length: 512       # e5-base 기본 상한. 실측 청크 최대(811토큰)보다 짧아서
                             # 긴 청크는 이 값에서 잘린다 -- arctic-ko(1024)와 다른 트레이드오프.
  # E5 계열은 대칭 인코딩이지만 query/passage를 각각 라벨링해야 한다(비대칭 arctic과 다름).
  query_prefix: "query: "
  passage_prefix: "passage: "

reranker:
  backend: local            # local | openrouter
  model_id: BAAI/bge-reranker-base
  device: cuda              # cuda 불가 시 cpu 자동 폴백
  batch_size: 16
  # bge-reranker-base는 XLM-RoBERTa-base 기반이라 최대 포지션이 514다(512+특수토큰
  # 2개). 이전 모델(bge-reranker-v2-m3, BGE-M3 기반이라 8192까지 지원)의 1024를
  # 그대로 뒀다가 포지션 임베딩 테이블 밖을 참조해서 CUDA assert(scatter/gather
  # index out of bounds)가 났다 — 실측으로 확인됨. 512로 낮춰서 안전 마진을 둔다.
  max_length: 512

chunking:
  # HybridChunker가 토큰 수를 세는 데 쓰는 토크나이저 (다국어/한국어)
  tokenizer: BAAI/bge-m3
  merge_peers: true
  # 파일 형식별 청킹 파라미터. 기본값 위에 형식별로 덮어씁니다.
  default:
    max_tokens: 512
    overlap_tokens: 64
  by_format:
    pdf:   { max_tokens: 512, overlap_tokens: 64 }
    hwp:   { max_tokens: 640, overlap_tokens: 80 }   # 사업계획서/보고서 - 서술형 긴 문단
    docx:  { max_tokens: 512, overlap_tokens: 64 }
    pptx:  { max_tokens: 320, overlap_tokens: 32 }   # 슬라이드 - 짧고 조각난 텍스트
    xlsx:  { max_tokens: 768, overlap_tokens: 0 }    # 표 - 행 경계에서만 자름
    txt:   { max_tokens: 512, overlap_tokens: 64 }
  # 이보다 짧은 청크는 버립니다(머리말/페이지번호 등 노이즈).
  min_chars: 30

retrieval:
  dense_top_k: 30
  sparse_top_k: 30
  rrf_k: 60
  final_top_k: 5          # STM/MTM(retrieve_memory)의 top_k와 맞춘 값
  # min_rerank_score는 더 이상 안 씀 -- 리랭커를 제거해서(retriever.py 참고) 걸러낼
  # 리랭커 점수 자체가 없다. RRF 점수는 스케일이 달라(항상 작은 양수) 이 문턱
  # 개념이 적용되지 않는다.

ocr:
  # 텍스트 레이어가 없는 스캔 PDF에만 적용되는 폴백 OCR (EasyOCR).
  lang: [ko, en]
  use_gpu: true
  confidence_threshold: 0.4
  scale: 2.0            # 렌더링 배율. 3.0은 느리기만 하고 이 코퍼스에선 이득이 없었다.
